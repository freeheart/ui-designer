<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>UI Designer · AI 辅助界面设计</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%230b0f17'/%3E%3Crect x='4' y='4' width='16' height='16' rx='3' fill='none' stroke='%236366f1' stroke-width='1.8'/%3E%3Cpath d='M4 9h16M9 9v11' stroke='%236366f1' stroke-width='1.8'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/canvas.css" />
  <link rel="stylesheet" href="/css/panels.css" />
  <link rel="stylesheet" href="/css/chat.css" />
</head>
<body>
  <div id="ud-app" class="ud-app">
    <header id="ud-toolbar" class="ud-toolbar">
      <div class="ud-toolbar__group ud-toolbar__group--brand">
        <span class="ud-logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7">
            <rect x="3" y="3" width="18" height="18" rx="4" />
            <path d="M3 9h18M9 9v12" />
          </svg>
        </span>
        <div class="ud-brand">
          <strong>UI Designer</strong>
          <span class="ud-brand__design" id="ud-design-name" title="双击重命名设计稿">Untitled</span>
        </div>
      </div>

      <div class="ud-toolbar__group ud-toolbar__group--center">
        <button class="ud-iconbtn" id="ud-btn-undo" title="撤销 (Ctrl+Z)" aria-label="撤销">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>
        </button>
        <button class="ud-iconbtn" id="ud-btn-redo" title="重做 (Ctrl+Shift+Z)" aria-label="重做">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m15 14 5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg>
        </button>
        <span class="ud-sep"></span>
        <button class="ud-iconbtn" id="ud-zoom-out" title="缩小 (-)" aria-label="缩小">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 12h14"/></svg>
        </button>
        <button class="ud-zoomlabel" id="ud-zoom-label" title="点击重置为 100%">100%</button>
        <button class="ud-iconbtn" id="ud-zoom-in" title="放大 (+)" aria-label="放大">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        <button class="ud-iconbtn" id="ud-btn-fit" title="适应画布 (Ctrl+0)" aria-label="适应画布">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
        </button>
        <span class="ud-sep"></span>
        <span class="ud-save" id="ud-save-status" data-kind="idle">已保存</span>
      </div>

      <div class="ud-toolbar__group ud-toolbar__group--right">
        <button class="ud-btn ud-btn--quiet" id="ud-btn-preview" title="预览 (P)">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
          预览
        </button>
        <button class="ud-btn ud-btn--quiet" id="ud-btn-export" title="导出代码">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3v12m0 0 4-4m-4 4-4-4"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
          导出
        </button>
        <button class="ud-iconbtn" id="ud-btn-settings" title="AI 与设计器设置" aria-label="设置">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 9 19.4a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34H9a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87V9a1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1Z"/></svg>
        </button>
      </div>
    </header>

    <main class="ud-main">
      <aside id="ud-left" class="ud-left" aria-label="图层与组件"></aside>
      <section id="ud-canvas-area" class="ud-canvas-area" aria-label="设计画布"></section>
      <aside id="ud-right" class="ud-right" aria-label="属性与 AI">
        <section id="ud-inspector" class="ud-inspector" aria-label="属性面板"></section>
        <section id="ud-chat" class="ud-chat" aria-label="AI 设计助手"></section>
      </aside>
    </main>
  </div>

  <div id="ud-modal-root"></div>
  <div id="ud-toast-root" class="ud-toasts" role="status" aria-live="polite"></div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
